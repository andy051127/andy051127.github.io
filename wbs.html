<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevFlow — WBS</title>
<style>
  :root {
    --primary:      #3182F6;
    --secondary:    #1D4ED8;
    --accent:       #60A5FA;
    --bg:           #F9FAFB;
    --card:         #ffffff;
    --card-border:  #E5E8EB;
    --text:         #191F28;
    --muted:        #6B7684;
    --green:        #16A34A;
    --green-bg:     #DCFCE7;
    --green-border: #86EFAC;
    --amber:        #D97706;
    --amber-bg:     #FEF3C7;
    --amber-border: #FCD34D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Segoe UI', -apple-system, sans-serif;
    padding: 48px 32px;
    min-height: 100vh;
  }
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  .container { max-width: 1100px; margin: 0 auto; }

  /* 뒤로 가기 */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: white;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 0.85em;
    font-weight: 600;
    color: var(--primary);
    text-decoration: none;
    margin-bottom: 28px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .back-btn:hover { background: #EFF6FF; }

  /* 헤더 */
  header { text-align: center; margin-bottom: 40px; }
  header .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  header .logo img { width: 44px; height: 44px; border-radius: 12px; }
  header h1 { color: var(--primary); font-size: 2em; font-weight: 800; letter-spacing: -0.02em; }
  header p { color: var(--muted); font-size: 0.9em; margin-top: 4px; }

  /* 요약 카드 */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .summary-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    border-top: 3px solid var(--accent);
  }
  .summary-card.green { border-top-color: var(--green); }
  .summary-card.amber { border-top-color: var(--amber); }
  .summary-card .num { font-size: 2.4em; font-weight: 800; color: var(--primary); }
  .summary-card.green .num { color: var(--green); }
  .summary-card.amber .num { color: var(--amber); }
  .summary-card .label { color: var(--muted); font-size: 0.88em; margin-top: 4px; }

  /* 진척률 */
  .overall-progress {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 36px;
  }
  .overall-progress h3 {
    color: var(--secondary);
    margin-bottom: 10px;
    font-size: 0.82em;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .progress-bar {
    background: #E5E8EB;
    border-radius: 8px;
    height: 16px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--secondary), var(--primary));
    transition: width 0.8s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 0.75em;
    color: var(--muted);
  }
  #overall-pct { color: var(--primary); font-weight: 700; }

  /* 섹션 */
  .section { margin-bottom: 28px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px 12px 0 0;
    border-left: 4px solid var(--accent);
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .section-header:hover { background: #F1F5F9; }
  .section-title { font-weight: 700; font-size: 1em; color: var(--secondary); }
  .section-meta { display: flex; align-items: center; gap: 10px; font-size: 0.76em; color: var(--muted); }
  .section-pct { color: var(--primary); font-weight: 700; }
  .chevron { transition: transform 0.2s; color: var(--muted); font-size: 0.8em; }
  .section.collapsed .chevron { transform: rotate(-90deg); }

  /* 태스크 목록 */
  .task-list {
    border: 1px solid var(--card-border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
  }
  .section.collapsed .task-list { display: none; }

  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--card-border);
    background: var(--card);
    font-size: 0.9em;
  }
  .task-item:last-child { border-bottom: none; }
  .task-item.done { background: #F0FDF4; }
  .task-item.todo { background: #FFFBEB; }

  /* 상태 배지 */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 5px;
    font-size: 0.76em;
    font-weight: 700;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .badge.done {
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid var(--green-border);
  }
  .badge.todo {
    background: var(--amber-bg);
    color: var(--amber);
    border: 1px solid var(--amber-border);
  }

  .task-name { flex: 1; color: var(--text); }
  .task-name.done-text { color: var(--muted); text-decoration: line-through; }

  .task-week {
    background: #DBEAFE;
    color: var(--secondary);
    border-radius: 10px;
    padding: 2px 10px;
    font-size: 0.76em;
    white-space: nowrap;
    font-weight: 500;
  }
  .task-week.past { background: var(--green-bg); color: var(--green); }

  /* 푸터 */
  footer {
    text-align: center;
    margin-top: 48px;
    color: var(--muted);
    font-size: 0.8em;
    padding-top: 20px;
    border-top: 1px solid var(--card-border);
  }
  footer a { color: var(--primary); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">

  <a class="back-btn" href="index.html">&#8592; 발표 슬라이드로 돌아가기</a>

  <header>
    <div class="logo">
      <img src="devflow_icon.png" alt="DevFlow">
      <h1>DevFlow — WBS</h1>
    </div>
    <p>Work Breakdown Structure</p>
  </header>

  <div class="summary-bar">
    <div class="summary-card green">
      <div class="num" id="done-count">—</div>
      <div class="label">완료 항목</div>
    </div>
    <div class="summary-card amber">
      <div class="num" id="todo-count">—</div>
      <div class="label">진행 예정</div>
    </div>
    <div class="summary-card">
      <div class="num" id="total-count">—</div>
      <div class="label">전체 항목</div>
    </div>
  </div>

  <div class="overall-progress">
    <h3>전체 진척률</h3>
    <div class="progress-bar">
      <div class="progress-fill" id="overall-fill" style="width:0%"></div>
    </div>
    <div class="progress-label">
      <span>0%</span>
      <span id="overall-pct">—</span>
      <span>100%</span>
    </div>
  </div>

  <div id="wbs-root"></div>

  <div style="text-align:center;margin-top:36px">
    <a class="back-btn" href="index.html" style="display:inline-flex">&#8592; 발표 슬라이드로 돌아가기</a>
  </div>

  <footer>
    <p>DevFlow &middot; 김찬희 &middot; 2026 &nbsp;|&nbsp;
      <a href="index.html">&#8592; 발표 슬라이드</a>
    </p>
  </footer>
</div>

<script>
const WBS = [
  {
    id: 'infra',
    title: '프로젝트 기반 설정',
    color: '#3182F6',
    tasks: [
      { name: 'Flutter 프로젝트 생성 및 패키지 설정', done: true, week: '12주차' },
      { name: 'SQLite 스키마 정의 (routines, routine_logs, schedules)', done: true, week: '12주차' },
      { name: '레이어드 아키텍처 디렉토리 구조 구성', done: true, week: '12주차' },
      { name: 'Riverpod ProviderScope 초기화', done: true, week: '12주차' },
      { name: '더미 시드 데이터 삽입 (42일 로그)', done: true, week: '12주차' },
    ]
  },
  {
    id: 'routine',
    title: '루틴 관리 (M-01 ~ M-03)',
    color: '#6366F1',
    tasks: [
      { name: '루틴 엔티티 모델 정의 (Routine)', done: true, week: '12주차' },
      { name: 'RoutineRepository CRUD 구현', done: true, week: '12주차' },
      { name: 'RoutineViewModel (StateNotifier) 구현', done: true, week: '12주차' },
      { name: '홈 화면 — 오늘 루틴 카드 목록', done: true, week: '12주차' },
      { name: '루틴 완료 체크 버튼 (토글)', done: true, week: '12주차' },
      { name: '루틴 추가/수정/삭제 폼 화면', done: true, week: '12주차' },
      { name: '반복 요일 선택 칩 UI', done: true, week: '12주차' },
      { name: '진행률 바 (오늘 완료/전체)', done: true, week: '12주차' },
      { name: '아이콘/색상 커스텀 + 이모지 직접 입력', done: true, week: '14주차' },
    ]
  },
  {
    id: 'streak',
    title: '스트릭 & 통계 (M-04, M-05)',
    color: '#F59E0B',
    tasks: [
      { name: 'StreakService.calculate() 구현', done: true, week: '12주차' },
      { name: 'StreakService.buildHeatmap() 구현', done: true, week: '12주차' },
      { name: '통계 화면 — 16주 달성 히트맵 (월 레이블, 요일 레이블, 툴팁)', done: true, week: '14주차' },
      { name: '통계 화면 — 루틴별 스트릭 리스트', done: true, week: '12주차' },
      { name: '홈 화면 루틴 카드에 스트릭 표시', done: true, week: '13주차' },
      { name: 'GitHub 잔디 연동 (contributions API)', done: true, week: '14주차' },
    ]
  },
  {
    id: 'schedule',
    title: '일정 관리 (M-06, M-07)',
    color: '#10B981',
    tasks: [
      { name: '일정 엔티티 모델 정의 (Schedule)', done: true, week: '12주차' },
      { name: 'ScheduleRepository CRUD 구현', done: true, week: '12주차' },
      { name: 'ScheduleViewModel (StateNotifier) 구현', done: true, week: '12주차' },
      { name: '홈 화면 — 다가오는 일정 카드 (D-day)', done: true, week: '12주차' },
      { name: '일정 추가/수정/삭제 폼 화면', done: true, week: '12주차' },
      { name: '일정 완료 체크 UI', done: true, week: '13주차' },
      { name: '전체 일정 목록 화면', done: true, week: '13주차' },
      { name: '캘린더 뷰 (table_calendar)', done: true, week: '13주차' },
    ]
  },
  {
    id: 'notification',
    title: '알림 (M-08)',
    color: '#8B5CF6',
    tasks: [
      { name: 'flutter_local_notifications 패키지 연동', done: true, week: '13주차' },
      { name: '루틴 알람 시간 설정 UI', done: true, week: '13주차' },
      { name: '요일별 알림 스케줄 등록 로직', done: true, week: '13주차' },
      { name: 'Android Core Library Desugaring 설정', done: true, week: '12주차' },
      { name: '알림 전체 on/off 설정', done: true, week: '13주차' },
      { name: 'USE_EXACT_ALARM 권한 + 배터리 최적화 가이드', done: true, week: '13주차' },
    ]
  },
  {
    id: 'achievement',
    title: '업적 시스템 (S-01)',
    color: '#EC4899',
    tasks: [
      { name: 'Achievement 엔티티 및 기본 업적 정의', done: true, week: '12주차' },
      { name: 'AchievementService.evaluate() 구현', done: true, week: '12주차' },
      { name: '업적 달성 알림 UI (다이얼로그)', done: true, week: '13주차' },
      { name: '업적 목록 화면', done: true, week: '13주차' },
      { name: '30가지 업적 마일스톤 확장 (1일~1460일)', done: true, week: '14주차' },
    ]
  },
  {
    id: 'could',
    title: 'Could 기능',
    color: '#06B6D4',
    tasks: [
      { name: '다크모드 (라이트/시스템/다크 전환)', done: true, week: '13주차' },
      { name: '홈 화면 위젯 (Android AppWidget)', done: true, week: '13주차' },
      { name: 'Bottom Navigation Bar (홈/캘린더/통계/업적)', done: true, week: '14주차' },
      { name: 'Google 로그인 (Firebase Auth)', done: true, week: '14주차' },
      { name: '클라우드 동기화 (Firebase Firestore)', done: true, week: '14주차' },
      { name: '앱 아이콘 커스텀 (flutter_launcher_icons)', done: true, week: '14주차' },
    ]
  },
  {
    id: 'ui',
    title: 'UI/UX 개선',
    color: '#F97316',
    tasks: [
      { name: 'Toss 디자인 시스템 적용 (AppTheme 전면 개편)', done: true, week: '14주차' },
      { name: 'DEBUG 배너 제거', done: true, week: '14주차' },
      { name: '홈 화면 FAB → 바텀시트로 개선', done: true, week: '14주차' },
      { name: '달성 히트맵 월/요일 레이블 + 툴팁 추가', done: true, week: '14주차' },
      { name: '더미 데이터 현재 날짜 기준으로 업데이트', done: true, week: '14주차' },
    ]
  },
  {
    id: 'docs',
    title: '문서 & 발표',
    color: '#0EA5E9',
    tasks: [
      { name: 'ADR 3종 (플랫폼/상태관리/저장소)', done: true, week: '12주차' },
      { name: 'AGENTS.md (단일 파일 AI 협업 통합 가이드)', done: true, week: '12주차' },
      { name: 'docs/architecture.md', done: true, week: '12주차' },
      { name: 'docs/setup.md', done: true, week: '12주차' },
      { name: 'docs/deploy.md', done: true, week: '12주차' },
      { name: 'docs/firebase.md (Firebase 연동 가이드)', done: true, week: '14주차' },
      { name: '테스트 코드 (StreakService 단위 테스트)', done: true, week: '14주차' },
      { name: '최종 발표 자료 (reveal.js + WBS + ADR)', done: true, week: '14주차' },
    ]
  },
];

function renderWBS() {
  const root = document.getElementById('wbs-root');
  let totalDone = 0, totalAll = 0;

  WBS.forEach(section => {
    const done  = section.tasks.filter(t => t.done).length;
    const total = section.tasks.length;
    const pct   = Math.round((done / total) * 100);
    totalDone += done;
    totalAll  += total;

    const el = document.createElement('div');
    el.className = 'section';
    el.innerHTML = `
      <div class="section-header" style="border-left-color:${section.color}" onclick="toggle(this)">
        <span class="section-title">${section.title}</span>
        <span class="section-meta">
          <span>${done}/${total}</span>
          <span class="section-pct">${pct}%</span>
          <span class="chevron">&#9662;</span>
        </span>
      </div>
      <div class="task-list">
        ${section.tasks.map(t => `
          <div class="task-item ${t.done ? 'done' : 'todo'}">
            <span class="badge ${t.done ? 'done' : 'todo'}">${t.done ? '완료' : '예정'}</span>
            <span class="task-name ${t.done ? 'done-text' : ''}">${t.name}</span>
            <span class="task-week ${t.done ? 'past' : ''}">${t.week}</span>
          </div>
        `).join('')}
      </div>
    `;
    root.appendChild(el);
  });

  const pct = Math.round((totalDone / totalAll) * 100);
  document.getElementById('done-count').textContent  = totalDone;
  document.getElementById('todo-count').textContent  = totalAll - totalDone;
  document.getElementById('total-count').textContent = totalAll;
  document.getElementById('overall-fill').style.width = pct + '%';
  document.getElementById('overall-pct').textContent  = pct + '%';
}

function toggle(header) {
  header.parentElement.classList.toggle('collapsed');
}

renderWBS();
</script>
</body>
</html>
